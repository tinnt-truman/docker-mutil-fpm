services:
  admin-php-fpm:
    #    image: bitnami/php-fpm:7.3
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin_php_fpm
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./admin:/var/www
    networks:
      - inan_network
    depends_on:
      - mysql

  admin-nginx:
    image: nginx:latest
    container_name: admin_nginx
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ./admin:/var/www
      - ./admin/admin-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin-php-fpm
      - mysql
    labels:
      traefik.enable: "true"
      traefik.http.services.nginx_inan.loadbalancer.server.port: 80
      traefik.http.routers.nginx_inan.rule: Host(`admin-inan.zoneb.vn`)
      traefik.http.routers.nginx_inan.tls: "true"
      traefik.http.routers.nginx_inan.entrypoints: webSecure
      traefik.http.routers.nginx_inan.tls.certresolver: letencrypt
    networks:
      - inan_network
      - traefik_public

  service-php-fpm:
    #    image: bitnami/php-fpm:8.4
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: inan_service_php_fpm
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./service:/var/www
    networks:
      - inan_network
    depends_on:
      - mysql

  service-nginx:
    image: nginx:latest
    container_name: inan_service_nginx
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./service:/var/www
      - ./service/service-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - service-php-fpm
      - mysql
    labels:
      traefik.enable: "true"
      traefik.http.services.nginx_laravel.loadbalancer.server.port: 80
      traefik.http.routers.nginx_laravel.rule: Host(`ecom-service.zoneb.vn`)
      traefik.http.routers.nginx_laravel.tls: "true"
      traefik.http.routers.nginx_laravel.entrypoints: webSecure
      traefik.http.routers.nginx_laravel.tls.certresolver: letencrypt
    networks:
      - inan_network
      - traefik_public

  mysql:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    container_name: inan_mysql_database
    tty: true
    ports:
      - "3309:3306"
    volumes:
      - "./service/docker/mysql/backup_inanviet_client.sql:/docker-entrypoint-initdb.d/init.sql"
    command: [ 'mysqld', '--default-authentication-plugin=mysql_native_password' ]
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: inanviet_client
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    networks:
      - inan_network

  phpmyadmin:
    image: adminer
    restart: always
    ports:
      - "9080:8080"
    volumes:
      - ./adminer.css:/var/www/html/adminer.css
    labels:
      traefik.enable: "true"
      traefik.http.services.adminer.loadbalancer.server.port: 8080
      traefik.http.routers.adminer.rule: Host(`adminer.zoneb.vn`)
      traefik.http.routers.adminer.tls: "true"
      traefik.http.routers.adminer.entrypoints: webSecure
      traefik.http.routers.adminer.tls.certresolver: letencrypt
    networks:
      - inan_network
      - traefik_public

networks:
  inan_network:
    driver: bridge
  traefik_public:
    external: true
