services:
  admin-php-fpm:
#    image: bitnami/php-fpm:7.3
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin_php_fpm
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./admin:/var/www
    networks:
      - inan_network
    depends_on:
      - mysql

  admin-nginx:
    image: nginx:latest
    container_name: admin_nginx
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8084:80"
    volumes:
      - ./admin:/var/www
      - ./admin/admin-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin-php-fpm
      - mysql
    networks:
      - inan_network

  service-php-fpm:
#    image: bitnami/php-fpm:8.4
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: inan_service_php_fpm
    platform: linux/amd64
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./service:/var/www
    networks:
      - inan_network
    depends_on:
      - mysql

  service-nginx:
    image: nginx:latest
    container_name: inan_service_nginx
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8083:80"
    volumes:
      - ./service:/var/www
      - ./service/service-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - service-php-fpm
      - mysql
    networks:
      - inan_network

  mysql:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    container_name: mysql_database
    tty: true
    ports:
      - "3308:3306"
    volumes:
      - "./service/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql"
    command: ['mysqld', '--default-authentication-plugin=mysql_native_password']
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: inanviet_client
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    networks:
      - inan_network

  phpmyadmin:
    image: adminer
    restart: always
    ports:
      - "9080:8080"
    volumes:
      - ./adminer.css:/var/www/html/adminer.css
    networks:
      - inan_network

networks:
  inan_network:
    driver: bridge
